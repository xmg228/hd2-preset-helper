[package]
name = "hd2-preset-helper"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "A Windows utility for saving and applying Stratagem and Booster presets from the Helldivers 2 loadout screen"
license = "GPL-3.0-or-later"
repository = "https://github.com/xmg228/hd2-preset-helper"
readme = "README.md"

[[bin]]
name = "HD2PresetHelper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
fast_image_resize = { version = "6.1.0", features = ["image"] }
half = "2.7.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
rayon = "1.12.0"
rust-embed = { version = "8.12.0", default-features = false, features = [
    "debug-embed",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
tray-icon = { version = "0.24.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
