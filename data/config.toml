# Restart the application after manually editing this file.

[presets]
# Apply Stratagems in the order they were saved.
apply_in_saved_order = false

# Press B after applying a preset with a booster.
auto_ready_up = false

# If a saved Booster is already in use, save a manually selected one as its fallback.
save_fallback_when_taken = false

# Optional labels shown beside each preset's hotkey.
# Remove the leading # from the labels you want to use.
[presets.labels]
# preset_1 = "Terminids 1"
# preset_2 = "Terminids 2"
# preset_3 = "Automatons 1"
# preset_4 = "Automatons 2"
# preset_5 = "Illuminate 1"
# preset_6 = "Illuminate 2"

[hotkey]
# Modifiers shared by all preset shortcuts: shift, ctrl, alt, win.
# Holding them also shows the overlay when enabled.
# Use [] for shortcuts without modifiers; hold-to-show is then unavailable.
modifiers = ["ctrl", "shift"]

# Preset keys, mapped to preset_1..preset_N in order.
# Values: f1-f12, 0-9 (top row), numpad0-numpad9 (numeric keypad).
# Choose at least one key, with no duplicates.
# Keep Num Lock on for numpad digits. Avoid combining them with Shift.
# Shortcuts are active only while Helldivers 2 is in the foreground.
keys = ["f7", "f8", "f9", "f10", "f11", "f12"]

[overlay]
# Show preset previews and action status.
enabled = true

# "auto" follows the game, or uses the primary display when the game is not in front.
# To use a fixed display, select it from the tray's Overlay monitor menu.
monitor = "auto"
