# Restart the application after manually editing this file.

[ui]
# Toggle the panel from the game or desktop. Set to "" to use the tray only.
panel_shortcut = "Ctrl + Shift + Space"

# Panel size and work-area-relative position are in logical pixels.
panel = { size = [900, 620] }

# Keep the panel visible when another window gains focus.
keep_panel_open_on_focus_loss = false

# "auto" follows the game, or uses the primary display when the game is not in front.
# To use a fixed display, select it in Settings > General.
monitor = "auto"

# "auto" follows the system language. Select a fixed language in Settings > General.
language = "auto"

# Show only preset titles and shortcuts in the list.
compact_preset_list = false

# Last acknowledged notice revision.
notice_revision = 0

[updates]
check_automatically = true

[presets]
# Shared scope for saving and applying, remembered by the panel.
# Unchecked sections stay unchanged. Applying skips unsaved sections.
scope = { stratagems = true, equipment = true, equipment_items = ["helmet", "armor", "cape", "primary", "secondary", "throwable"] }

# Apply Stratagems in saved order when all four slots start empty.
apply_in_saved_order = false

# Press B after applying a preset with a booster.
auto_ready_up = false

# If a saved Booster is already in use, save a manually selected one as its fallback.
save_fallback_when_taken = false
