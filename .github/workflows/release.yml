name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --check

      - name: Install license tool
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "cargo-about-0.9.3-x86_64-pc-windows-msvc.tar.gz"
          gh release download 0.9.3 --repo EmbarkStudios/cargo-about `
            --pattern $archive --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Could not download cargo-about" }
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne "9e2942533ef1c592c4a70bdb384cae1550a3f5fc9ae40379b6662e3d2f16fe02") {
            throw "cargo-about checksum mismatch"
          }
          tar -xzf $archivePath -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Could not extract cargo-about" }
          "$env:RUNNER_TEMP/cargo-about-0.9.3-x86_64-pc-windows-msvc" >> $env:GITHUB_PATH

      - name: Clippy
        shell: pwsh
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Read the package version from Cargo.toml/Cargo.lock.
          $metadata = cargo metadata `
            --locked `
            --filter-platform x86_64-pc-windows-msvc `
            --format-version 1 |
            ConvertFrom-Json

          $package = $metadata.packages |
            Where-Object { $_.name -eq "hd2-preset-helper" } |
            Select-Object -First 1

          if (-not $package) {
            throw "Package hd2-preset-helper was not found"
          }

          # Require the tag to match the Cargo package version.
          $expectedTag = "v$($package.version)"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version)"
          }

          # These versions match the supplemental notices in the template.
          $reviewed = @{ slint = "1.18.1"; "i-slint-compiler" = "1.18.1"; lyon_geom = "1.0.20" }
          foreach ($dependency in $metadata.packages) {
            if ($reviewed.ContainsKey($dependency.name) -and $dependency.version -ne $reviewed[$dependency.name]) {
              throw "Review packaging/notices.hbs for the updated $($dependency.name) dependency"
            }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $notices = "dist/THIRD_PARTY_NOTICES.txt"
          $buildScript = cargo build --release --locked --message-format=json-render-diagnostics |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq "build-script-executed" -and $_.package_id -eq $package.id } |
            Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
          if (-not $buildScript) { throw "Could not locate the build's embedded license notices" }
          Copy-Item -LiteralPath "$($buildScript.out_dir)/third-party-notices.txt" -Destination $notices

          $exe = "target\release\HD2PresetHelper.exe"
          $packageDir = "dist\package\HD2PresetHelper"
          $zipName = "HD2PresetHelper-$expectedTag-windows-x64.zip"
          $zipPath = "dist\$zipName"

          if (-not (Test-Path $exe)) {
            throw "Executable was not produced: $exe"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageDir |
            Out-Null

          Copy-Item `
            -Path $exe `
            -Destination "$packageDir\HD2PresetHelper.exe"

          # Compress the directory itself so the ZIP contains one top-level
          # HD2PresetHelper folder.
          Compress-Archive `
            -Path $packageDir `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Attest artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/package/HD2PresetHelper/HD2PresetHelper.exe
            dist/*.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArgs = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "dist\$env:ZIP_NAME",
            "dist\THIRD_PARTY_NOTICES.txt",
            "--verify-tag",
            "--generate-notes",
            "--title", "HD2 Preset Helper $env:GITHUB_REF_NAME"
          )

          if ($env:GITHUB_REF_NAME -match "-") {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
